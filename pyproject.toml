[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rundowntft"
version = "0.1.0"
description = "Hotkey-driven VOD reviewer for Teamfight Tactics with analyzable notes, tags and metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=7"]

[project.scripts]
tftreview = "tftreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
